<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="140" height="140">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#10161F"/>
      <stop offset="100%" stop-color="#080C14"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="#232B38" stroke-width="1.5"/>

  <!-- Anneau central -->
  <circle cx="100" cy="100" r="34" fill="none" stroke="#00FFB3" stroke-width="4" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="13" fill="#00FFB3" filter="url(#glow)"/>

  <!-- Points en orbite -->
  <circle cx="100" cy="37" r="9" fill="#4D9FFF" filter="url(#glow)"/>
  <circle cx="154" cy="130" r="9" fill="#A855F7" filter="url(#glow)"/>
  <circle cx="46" cy="130" r="9" fill="#EAB308" filter="url(#glow)"/>

  <!-- Traits d'orbite discrets -->
  <circle cx="100" cy="100" r="63" fill="none" stroke="#232B38" stroke-width="1" stroke-dasharray="2 4"/>
</svg>
